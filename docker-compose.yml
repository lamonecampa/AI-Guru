version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiteachergrader_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aiteachergrader_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiteachergrader_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiteachergrader_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aiteachergrader_db?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-MY_GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.8-flash
      AUTH_SECRET: ${AUTH_SECRET:-kuncirahasia_aiteachergrader_2026}

volumes:
  pgdata:
    driver: local
